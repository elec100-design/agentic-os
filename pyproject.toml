[project]
name = "agentic-os"
version = "1.0.0"
description = "구독형 AI CLI(Claude·Antigravity·Grok·Hermes)를 실측 사용량 기반으로 통합하는 로컬 웹 대시보드"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # starlette 내부의 httpx→httpx2 이행 안내 — 우리 코드가 아님
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
