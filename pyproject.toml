[project]
name = "agentic-os"
version = "1.0.0"
description = "구독형 AI CLI(Claude·Antigravity·Grok·Hermes)를 실측 사용량 기반으로 통합하는 로컬 웹 대시보드"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

# `aos` / `aos doctor` 명령. editable 설치(`pip install -e .`)로 쓰면
# templates/static/data 경로가 저장소 기준으로 유지된다.
[project.scripts]
aos = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # starlette 내부의 httpx→httpx2 이행 안내 — 우리 코드가 아님
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
