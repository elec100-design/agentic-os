<!doctype html>
<html lang="{{ lang() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#{{ channel['title'] }} — Agentic OS</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v() }}">
<link rel="stylesheet" href="/static/hljs-theme.css?v={{ asset_v() }}">
<script>(function(){try{var t=localStorage.getItem("aos-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<script>window.LANG={{ lang() | tojson }};window.I18N={{ i18n_map() | tojson }};function t(s){return (window.LANG==="en"&&window.I18N[s])||s;}</script>
</head>
<body class="with-sidebar">
<button id="nav-toggle" aria-label="{{ '사이드바 열기/닫기' | t }}">
  <svg viewBox="0 0 16 16" width="16" height="16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M2 4h12M2 8h12M2 12h12"/>
  </svg>
</button>

{#- 대화 중에도 다른 상대로 바로 옮겨갈 수 있어야 한다 — 홈과 같은 목록을 단다. -#}
<aside class="sidebar">
  <div class="brand">
    <a class="wordmark" href="/">Agentic OS</a>
  </div>
  <div class="side-scroll">
    {% include "partials/agent_rail.html" %}
  </div>
  <div class="side-foot">
    <a class="side-settings" href="/setup">{{ '⚙︎ 모델 설정' | t }}</a>
    <a class="side-settings" href="/settings/mcp">{{ '🔌 MCP 서버' | t }}</a>
  </div>
</aside>

<main class="page channel-page">
{% include "partials/channel_view.html" %}
</main>

<script src="/static/marked.min.js?v={{ asset_v() }}"></script>
<script src="/static/highlight.min.js?v={{ asset_v() }}"></script>
<script src="/static/render.js?v={{ asset_v() }}"></script>
<script src="/static/nav.js?v={{ asset_v() }}"></script>
<script src="/static/agent-rail.js?v={{ asset_v() }}"></script>
<script src="/static/channels.js?v={{ asset_v() }}"></script>
</body>
</html>
