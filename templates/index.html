<!doctype html>
<html lang="{{ lang() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic OS</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v() }}">
<link rel="stylesheet" href="/static/hljs-theme.css?v={{ asset_v() }}">
<link rel="stylesheet" href="/static/orca-theme.css?v={{ asset_v() }}">
<script>/* 저장된 테마를 페인트 전에 적용 (FOUC 방지) */(function(){try{var t=localStorage.getItem("aos-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<script>window.LANG={{ lang() | tojson }};window.I18N={{ i18n_map() | tojson }};function t(s){return (window.LANG==="en"&&window.I18N[s])||s;}</script>
<script src="/static/htmx.min.js"></script>
</head>
<body class="with-sidebar orca orca-home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Agentic OS 오빗 마크 — 코어를 도는 3개 에이전트 노드 -->
    <g id="spark-mark" fill="none" stroke="var(--accent)" stroke-width="1.6">
      <circle cx="12" cy="12" r="8"/>
      <circle cx="12" cy="12" r="2.3" fill="var(--accent)" stroke="none"/>
      <circle cx="12" cy="4" r="1.7" fill="var(--accent)" stroke="none"/>
      <circle cx="18.9" cy="16" r="1.7" fill="var(--accent)" stroke="none"/>
      <circle cx="5.1" cy="16" r="1.7" fill="var(--accent)" stroke="none"/>
    </g>
  </defs>
</svg>

<button id="nav-toggle" aria-label="{{ '사이드바 열기/닫기' | t }}">
  <svg viewBox="0 0 16 16" width="16" height="16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M2 4h12M2 8h12M2 12h12"/>
  </svg>
</button>

<!-- 태블릿/모바일(<1024px)에서 우측 레일을 화면 밖에서 불러오는 진입점 -->
<button type="button" class="orca-side-rail-toggle" id="home-rail-toggle" aria-label="{{ '채팅 열기/닫기' | t }}" aria-controls="home-rail" aria-expanded="false">
  <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h12v9H6l-3 2.5V12H2z"/></svg>
</button>
<div class="orca-side-rail-scrim" id="home-rail-scrim" hidden></div>

<!-- Orca ADE식 3분할 셸 — 좌: 내비 사이드바 / 중앙: 멀티 탭 워크스페이스 /
     우: 채팅·세션 레일. 최하단은 접히는 작업 큐 상태바. -->
<div class="orca-home-shell">
<div class="orca-home-row">

<aside class="sidebar">
  <div class="brand">
    <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><use href="#spark-mark"/></svg>
    <a class="wordmark" href="/">Agentic OS</a>
    <!-- 서랍(≤900px)에서만 보이는 되접기 버튼 — 사이드바를 왼쪽으로 밀어 넣는다 -->
    <button type="button" class="side-close-btn" id="nav-close" aria-label="{{ '사이드바 닫기' | t }}">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8h-11M6.5 4l-4 4 4 4"/></svg>
    </button>
  </div>
  <a class="side-nav-link" href="/board">🗂 {{ '비전 보드' | t }}</a>
  <section class="side-memory" id="memory" hx-get="/partials/memory" hx-trigger="load, refresh-memory from:body"></section>
  <section class="side-usage" id="usage" hx-get="/partials/usage" hx-trigger="load, every 15s"></section>
  <div class="side-foot">
    <a class="side-settings" href="/setup" title="{{ '에이전트 활성화·설치 상태 재설정' | t }}">{{ '⚙︎ 에이전트 설정' | t }}</a>
    <div class="side-foot-btns">
      <a class="lang-toggle" href="/lang/{{ 'ko' if lang() == 'en' else 'en' }}" title="{{ '언어 전환 (한국어/English)' | t }}">{{ '한국어' if lang() == 'en' else 'EN' }}</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="{{ '라이트/다크 테마 전환' | t }}" title="{{ '테마 전환' | t }}">
        <svg class="ico-sun" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2 3.1 3.1"/></svg>
        <svg class="ico-moon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
      </button>
    </div>
  </div>
</aside>

<!-- ══ 중앙 메인뷰 — 진행과정·코드를 여는 멀티 탭 워크스페이스 ══════════ -->
<main class="orca-home-main">
  <div class="orca-home-ws" id="home-workspace">
    <header class="orca-tabbar" id="home-tabbar" hidden>
      <button type="button" class="orca-tabbar-navbtn" data-tabbar-nav="prev" aria-label="{{ '이전 탭' | t }}" hidden>‹</button>
      <div class="orca-tabbar-scroll" id="home-tabbar-scroll" role="tablist" aria-label="{{ '작업 탭' | t }}"></div>
      <button type="button" class="orca-tabbar-navbtn" data-tabbar-nav="next" aria-label="{{ '다음 탭' | t }}" hidden>›</button>
    </header>

    <div class="orca-tab-panels" id="home-tab-panels"></div>

    <!-- 열린 탭이 없을 때의 중앙 화면 -->
    <div class="orca-home-empty" id="home-tab-empty">
      <div class="hero">
        <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><use href="#spark-mark"/></svg>
        <h1>{{ '무엇을 도와드릴까요?' | t }}</h1>
      </div>
      <p class="orca-muted">{{ '오른쪽에서 작업을 보내면 진행과정이 여기 탭으로 열립니다.' | t }}</p>
    </div>
  </div>
</main>

<!-- ══ 우측 레일 — 채팅창 + 세션 목록 ═══════════════════════════════════ -->
<aside class="orca-side-rail" id="home-rail">
  <div class="orca-side-rail-handle" id="home-rail-resize" role="separator" aria-orientation="vertical" aria-label="{{ '패널 너비 조절' | t }}" tabindex="0"></div>
  <div class="orca-rail-head">
    <span class="orca-rail-title">{{ '에이전트' | t }}</span>
    <!-- 모바일에서는 오프캔버스 닫기(→), 데스크톱에서는 폭 접기(›) -->
    <button type="button" class="orca-rail-close-btn" id="home-rail-close" aria-label="{{ '닫기' | t }}">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h11M9.5 4l4 4-4 4"/></svg>
    </button>
    <button type="button" class="orca-rail-collapse-btn" id="home-rail-collapse" aria-label="{{ '접기/펼치기' | t }}">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
    </button>
  </div>

  <div class="orca-rail-tabs">
    <button type="button" class="orca-rail-tab active" data-rail-tab="chat">{{ '채팅' | t }}</button>
    <button type="button" class="orca-rail-tab" data-rail-tab="sessions">{{ '세션' | t }}</button>
  </div>

  <div class="orca-rail-panels">
    <!-- 채팅 탭 — 최근 요청 말풍선 + 컴포저 -->
    <section class="orca-rail-panel" data-rail-panel="chat">
      <div class="orca-rail-scroll" id="home-chat-scroll"></div>

      <form class="composer" id="composer" method="post" action="/jobs" enctype="multipart/form-data">
        <textarea name="prompt" id="prompt" rows="3" required placeholder="{{ '작업을 설명해 주세요… 파일을 끌어다 놓을 수도 있어요' | t }}"></textarea>
        <div class="file-chips" id="file-chips"></div>
        <div class="auto-hint" id="auto-hint" hidden></div>

        <input type="hidden" name="provider" id="provider-input" value="auto">
        <input type="hidden" name="model" id="model-input" value="">

        <div class="composer-bar">
          <!-- 첨부·도구 메뉴 (+) -->
          <button type="button" class="cbar-btn" id="tools-btn" aria-label="{{ '첨부·도구' | t }}" aria-haspopup="true">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
          </button>

          <!-- 에이전트 선택 칩 -->
          <button type="button" class="cbar-chip" id="agent-btn" aria-haspopup="true">
            <span class="chip-agent" id="agent-label">{{ '자동' | t }}</span>
            <svg class="pill-caret" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
          </button>

          <!-- 모델 선택 칩 (에이전트가 자동이 아니고 모델이 여러 개일 때만 표시) -->
          <button type="button" class="cbar-chip" id="model-btn" aria-haspopup="true" hidden>
            <span class="chip-agent" id="model-label">{{ '모델' | t }}</span>
            <svg class="pill-caret" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
          </button>

          <!-- 작업 위치 칩 -->
          <span class="workspace-picker" id="workspace-picker" hx-get="/partials/workspaces" hx-trigger="load"></span>

          <span class="spacer"></span>

          <button type="submit" class="send" aria-label="{{ '전송' | t }}">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/>
            </svg>
          </button>
        </div>

        <!-- 도구 팝업: 파일·메모리·타임아웃 (폼 안이라 그대로 제출된다) -->
        <div class="cbar-popup tools-popup" id="tools-popup" hidden>
          <label class="tools-row" title="{{ '사진·파일 첨부' | t }}">
            <input type="file" name="files" id="file-input" multiple>
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.2 7.2 8.4 12a3.4 3.4 0 0 1-4.8-4.8l4.8-4.8a2.3 2.3 0 0 1 3.2 3.2L6.8 10.4a1.1 1.1 0 0 1-1.6-1.6l4.4-4.4"/>
            </svg>
            <span>{{ '파일 첨부…' | t }}</span>
          </label>
          <label class="tools-row">
            <input type="checkbox" name="attach_memory" value="true">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5 3 4.5v4c0 3 2.2 4.6 5 5.5 2.8-.9 5-2.5 5-5.5v-4z"/></svg>
            <span>{{ '메모리 첨부' | t }}</span>
          </label>
          <label class="tools-row tools-timeout">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="5"/><path d="M8 6.5V9l1.6 1M6 1.8h4"/></svg>
            <span>{{ '타임아웃' | t }}</span>
            <input type="number" name="timeout_min" min="1" placeholder="{{ '자동' | t }}"> {{ '분' | t }}
          </label>
        </div>

        <!-- 에이전트 팝업 (JS가 채움) -->
        <div class="cbar-popup agent-popup" id="agent-popup" hidden></div>
        <!-- 모델 팝업 (JS가 채움) -->
        <div class="cbar-popup agent-popup" id="model-popup" hidden></div>
      </form>
    </section>

    <!-- 세션 탭 — 주제별 채널 목록 -->
    <section class="orca-rail-panel" data-rail-panel="sessions" hidden>
      <div class="orca-rail-scroll">
        <section class="side-channels" id="channels" hx-get="/partials/channels" hx-trigger="load, every 5s, refresh-channels from:body"></section>
      </div>
    </section>
  </div>
</aside>

</div><!-- /.orca-home-row -->

<!-- ══ 최하단 작업 큐 상태바 — 기본은 접힘, 클릭하면 펼쳐진다 ══════════ -->
<div class="orca-statusbar" id="home-statusbar">
  <button type="button" class="orca-statusbar-bar" id="statusbar-toggle"
          aria-expanded="false" aria-controls="statusbar-body">
    <svg class="orca-statusbar-caret" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>
    <span class="orca-statusbar-label">{{ '작업 큐' | t }}</span>
    <span class="orca-statusbar-counts" id="statusbar-counts"></span>
  </button>
  <div class="orca-statusbar-body" id="statusbar-body" hidden>
    <section class="panel" id="jobs" hx-get="/partials/jobs" hx-trigger="load, every 3s, refresh-jobs from:body"></section>
  </div>
</div>

</div><!-- /.orca-home-shell -->

<!-- 노트 컨텍스트 메뉴 (문서에 하나, 위치는 JS가 지정) -->
<div class="note-dropdown" id="note-dropdown" hidden></div>

<!-- 작업 위치 추가 모달 (폴더 탐색 / GitHub 리포) -->
<div class="modal-overlay" id="ws-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ws-modal-title">
    <div class="modal-head">
      <div class="modal-tabs">
        <button type="button" class="modal-tab active" data-tab="folder">{{ '📁 폴더 선택' | t }}</button>
        <button type="button" class="modal-tab" data-tab="github">{{ '⑂ GitHub 리포' | t }}</button>
      </div>
      <button type="button" class="modal-close" id="ws-modal-close" aria-label="{{ '닫기' | t }}">✕</button>
    </div>
    <div class="modal-body" id="ws-modal-body"></div>
    <div class="modal-foot" id="ws-modal-foot"></div>
  </div>
</div>

<!-- 새 채널 만들기 모달 -->
<div class="modal-overlay" id="channel-modal" hidden>
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="channel-modal-title">
    <div class="modal-head">
      <span id="channel-modal-title">{{ '새 채널 만들기' | t }}</span>
      <button type="button" class="modal-close" id="channel-modal-close" aria-label="{{ '닫기' | t }}">✕</button>
    </div>
    <div class="modal-body">
      <label class="ch-field">
        <span>{{ '채널 이름' | t }}</span>
        <input type="text" id="channel-title" placeholder="{{ '예: 결제 리팩터링' | t }}" maxlength="80">
      </label>
      <label class="ch-field">
        <span>{{ '주제 (선택)' | t }}</span>
        <input type="text" id="channel-topic" placeholder="{{ '이 채널에서 다룰 작업을 짧게 설명' | t }}" maxlength="200">
      </label>
      <div class="ch-error" id="channel-error" hidden></div>
    </div>
    <div class="modal-foot">
      <span class="modal-hint">{{ '주제별로 대화를 이어가며 답장으로 세션을 유지할 수 있어요' | t }}</span>
      <button type="button" class="btn-primary" id="channel-create-btn">{{ '만들기' | t }}</button>
    </div>
  </div>
</div>

<script>
const MODELS = {{ provider_models | tojson }};
const AGENT_ORDER = {{ agent_order | tojson }};
const COUNCIL_ENABLED = {{ council_enabled | tojson }};
</script>
<script src="/static/app.js?v={{ asset_v() }}"></script>
<script src="/static/channels.js?v={{ asset_v() }}"></script>
<script src="/static/marked.min.js?v={{ asset_v() }}"></script>
<script src="/static/highlight.min.js?v={{ asset_v() }}"></script>
<script src="/static/render.js?v={{ asset_v() }}"></script>
<script src="/static/job-view.js?v={{ asset_v() }}"></script>
<script src="/static/home.js?v={{ asset_v() }}"></script>
</body>
</html>
