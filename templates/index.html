<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic OS</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js"></script>
</head>
<body class="with-sidebar">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="spark-mark" stroke="var(--accent)" stroke-width="2.1" stroke-linecap="round">
      <line x1="12" y1="12" x2="12" y2="2.2"/>
      <line x1="12" y1="12" x2="12" y2="3.6" transform="rotate(33 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="2.6" transform="rotate(66 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="3.4" transform="rotate(99 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="2.4" transform="rotate(132 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="3.6" transform="rotate(165 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="2.8" transform="rotate(198 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="3.2" transform="rotate(231 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="2.3" transform="rotate(264 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="3.5" transform="rotate(297 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="2.7" transform="rotate(330 12 12)"/>
    </g>
  </defs>
</svg>

<button id="nav-toggle" aria-label="사이드바 열기/닫기">
  <svg viewBox="0 0 16 16" width="16" height="16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M2 4h12M2 8h12M2 12h12"/>
  </svg>
</button>

<aside class="sidebar">
  <div class="brand">
    <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><use href="#spark-mark"/></svg>
    <a class="wordmark" href="/">Agentic OS</a>
  </div>
  <section class="side-memory" id="memory" hx-get="/partials/memory" hx-trigger="load, refresh-memory from:body"></section>
  <section class="side-usage" id="usage" hx-get="/partials/usage" hx-trigger="load, every 15s"></section>
</aside>

<main>
<div class="hero">
  <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><use href="#spark-mark"/></svg>
  <h1>무엇을 도와드릴까요?</h1>
</div>

<form class="composer" id="composer" method="post" action="/jobs" enctype="multipart/form-data">
  <textarea name="prompt" id="prompt" rows="3" required placeholder="작업을 설명해 주세요… 파일을 끌어다 놓을 수도 있어요"></textarea>
  <div class="file-chips" id="file-chips"></div>
  <div class="auto-hint" id="auto-hint" hidden></div>

  <input type="hidden" name="provider" id="provider-input" value="auto">
  <input type="hidden" name="model" id="model-input" value="">

  <div class="composer-bar">
    <div class="provider-picker" id="provider-picker">
      <button type="button" class="pill active" data-provider="auto">자동</button>
      {% for p in ['claude', 'gemini', 'grok', 'hermes'] %}
      <button type="button" class="pill" data-provider="{{ p }}">
        <span class="pill-name">{{ p|capitalize }}</span><span class="pill-model"></span>
        {% if provider_models[p]|length > 1 %}
        <svg class="pill-caret" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
        {% endif %}
      </button>
      {% endfor %}
    </div>
    <span class="spacer"></span>
    <span class="workspace-picker" id="workspace-picker" hx-get="/partials/workspaces" hx-trigger="load"></span>
    <label class="pill file-pill" title="사진·파일 첨부">
      <input type="file" name="files" id="file-input" multiple>
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.2 7.2 8.4 12a3.4 3.4 0 0 1-4.8-4.8l4.8-4.8a2.3 2.3 0 0 1 3.2 3.2L6.8 10.4a1.1 1.1 0 0 1-1.6-1.6l4.4-4.4"/>
      </svg>
      <span>파일</span>
    </label>
    <label class="pill checkbox-pill"><input type="checkbox" name="attach_memory" value="true"><span>메모리 첨부</span></label>
    <label class="timeout">타임아웃 <input type="number" name="timeout_min" min="1"> 분</label>
    <button type="submit" class="send" aria-label="전송">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/>
      </svg>
    </button>
  </div>

  <div class="model-popup" id="model-popup" hidden></div>
</form>

<section class="panel" id="jobs" hx-get="/partials/jobs" hx-trigger="load, every 3s, refresh-jobs from:body"></section>
</main>

<!-- 노트 컨텍스트 메뉴 (문서에 하나, 위치는 JS가 지정) -->
<div class="note-dropdown" id="note-dropdown" hidden></div>

<!-- 작업 위치 추가 모달 (폴더 탐색 / GitHub 리포) -->
<div class="modal-overlay" id="ws-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ws-modal-title">
    <div class="modal-head">
      <div class="modal-tabs">
        <button type="button" class="modal-tab active" data-tab="folder">📁 폴더 선택</button>
        <button type="button" class="modal-tab" data-tab="github">⑂ GitHub 리포</button>
      </div>
      <button type="button" class="modal-close" id="ws-modal-close" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="ws-modal-body"></div>
    <div class="modal-foot" id="ws-modal-foot"></div>
  </div>
</div>

<script>
const MODELS = {{ provider_models | tojson }};
</script>
<script src="/static/app.js"></script>
</body>
</html>
