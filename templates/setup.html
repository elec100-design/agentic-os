<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic OS — {{ '시작하기' | t }}</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v() }}">
<script>(function(){try{var t=localStorage.getItem("aos-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<script>window.LANG={{ lang() | tojson }};window.I18N={{ i18n_map() | tojson }};function t(s){return (window.LANG==="en"&&window.I18N[s])||s;}</script>
</head>
<body class="setup-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Agentic OS 오빗 마크 — 코어를 도는 3개 에이전트 노드 -->
    <g id="spark-mark" fill="none" stroke="var(--accent)" stroke-width="1.6">
      <circle cx="12" cy="12" r="8"/>
      <circle cx="12" cy="12" r="2.3" fill="var(--accent)" stroke="none"/>
      <circle cx="12" cy="4" r="1.7" fill="var(--accent)" stroke="none"/>
      <circle cx="18.9" cy="16" r="1.7" fill="var(--accent)" stroke="none"/>
      <circle cx="5.1" cy="16" r="1.7" fill="var(--accent)" stroke="none"/>
    </g>
  </defs>
</svg>

<header class="setup-brand">
  <svg class="spark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><use href="#spark-mark"/></svg>
  <span class="wordmark">Agentic OS</span>
</header>

<main class="setup-main">
  <ol class="setup-steps" id="setup-steps" aria-label="{{ '셋업 진행 단계' | t }}">
    <li class="step" data-step="1"><span class="step-dot">1</span><span class="step-name">{{ '환영' | t }}</span></li>
    <li class="step" data-step="2"><span class="step-dot">2</span><span class="step-name">{{ '에이전트' | t }}</span></li>
    <li class="step" data-step="3"><span class="step-dot">3</span><span class="step-name">{{ '로그인' | t }}</span></li>
    <li class="step" data-step="4"><span class="step-dot">4</span><span class="step-name">{{ '완료' | t }}</span></li>
  </ol>

  <section class="setup-card" id="setup-body" aria-live="polite"></section>

  <footer class="setup-foot">
    <button type="button" class="btn-ghost" id="setup-back" hidden>{{ '이전' | t }}</button>
    <span class="setup-foot-spacer"></span>
    <button type="button" class="setup-skip" id="setup-skip" hidden>{{ '건너뛰기' | t }}</button>
    <button type="button" class="btn-primary" id="setup-next">{{ '시작하기' | t }}</button>
  </footer>
  <p class="setup-error" id="setup-error" hidden></p>
</main>

<script>
const SETUP = {
  completed: {{ current.setup_completed | tojson }},
  enabled: {{ current.enabled_providers | tojson }},
  memoryDir: {{ memory_dir | tojson }},
  vaultSet: {{ vault_set | tojson }},
  councilMembers: {{ council_members | tojson }},
  councilMin: {{ council_min | tojson }}
};
</script>
<script src="/static/setup.js?v={{ asset_v() }}"></script>
</body>
</html>
