<!doctype html>
<html lang="{{ lang() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ '비전 보드' | t }} — Agentic OS</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v() }}">
<script>(function(){try{var t=localStorage.getItem("aos-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<script>window.LANG={{ lang() | tojson }};window.I18N={{ i18n_map() | tojson }};function t(s){return (window.LANG==="en"&&window.I18N[s])||s;}</script>
<script src="/static/htmx.min.js"></script>
</head>
<body data-page="board">
<main class="page">
<a class="back-link" href="/">{{ '← 대시보드' | t }}</a>
<div class="hero board-hero">
  <h1>{{ '비전 보드' | t }}</h1>
  <p class="board-sub">{{ '목표를 주면 메인 에이전트가 태스크로 분해하고, 승인 후 하위 에이전트들이 끝까지 완성합니다.' | t }}</p>
</div>

<form class="composer" id="composer" method="post" action="/projects" enctype="multipart/form-data">
  <textarea name="goal" id="goal" rows="3" required placeholder="{{ '프로젝트 목표를 설명해 주세요… 예: 신제품 소개 랜딩페이지 문구와 히어로 이미지를 만들어줘' | t }}"></textarea>
  <div class="file-chips" id="file-chips"></div>

  <input type="hidden" name="provider" id="provider-input" value="auto">
  <input type="hidden" name="model" id="model-input" value="">

  <div class="composer-bar">
    <!-- 첨부·도구 메뉴 (+) -->
    <button type="button" class="cbar-btn" id="tools-btn" aria-label="{{ '첨부·도구' | t }}" aria-haspopup="true">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
    </button>

    <!-- 에이전트 선택 칩 -->
    <button type="button" class="cbar-chip" id="agent-btn" aria-haspopup="true">
      <span class="chip-agent" id="agent-label">{{ '자동' | t }}</span>
      <svg class="pill-caret" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
    </button>

    <!-- 모델 선택 칩 (에이전트가 자동이 아니고 모델이 여러 개일 때만 표시) -->
    <button type="button" class="cbar-chip" id="model-btn" aria-haspopup="true" hidden>
      <span class="chip-agent" id="model-label">{{ '모델' | t }}</span>
      <svg class="pill-caret" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
    </button>

    <!-- 작업 위치 칩 (로컬 폴더 / GitHub 리포) -->
    <span class="workspace-picker" id="workspace-picker" hx-get="/partials/workspaces" hx-trigger="load"></span>

    <span class="spacer"></span>

    <button type="submit" class="send" aria-label="{{ '프로젝트 시작' | t }}">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/>
      </svg>
    </button>
  </div>

  <!-- 도구 팝업: 파일·메모리·타임아웃 (폼 안이라 그대로 제출된다) -->
  <div class="cbar-popup tools-popup" id="tools-popup" hidden>
    <label class="tools-row" title="{{ '사진·파일 첨부' | t }}">
      <input type="file" name="files" id="file-input" multiple>
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.2 7.2 8.4 12a3.4 3.4 0 0 1-4.8-4.8l4.8-4.8a2.3 2.3 0 0 1 3.2 3.2L6.8 10.4a1.1 1.1 0 0 1-1.6-1.6l4.4-4.4"/>
      </svg>
      <span>{{ '파일 첨부…' | t }}</span>
    </label>
    <label class="tools-row">
      <input type="checkbox" name="attach_memory" value="true">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5 3 4.5v4c0 3 2.2 4.6 5 5.5 2.8-.9 5-2.5 5-5.5v-4z"/></svg>
      <span>{{ '메모리 첨부' | t }}</span>
    </label>
    <label class="tools-row tools-timeout">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="5"/><path d="M8 6.5V9l1.6 1M6 1.8h4"/></svg>
      <span>{{ '타임아웃' | t }}</span>
      <input type="number" name="timeout_min" min="1" placeholder="{{ '자동' | t }}"> {{ '분' | t }}
    </label>
  </div>

  <!-- 에이전트 팝업 (JS가 채움) -->
  <div class="cbar-popup agent-popup" id="agent-popup" hidden></div>
  <!-- 모델 팝업 (JS가 채움) -->
  <div class="cbar-popup agent-popup" id="model-popup" hidden></div>
</form>

<section class="panel" id="projects" hx-get="/partials/projects" hx-trigger="load, every 5s"></section>
</main>

<!-- 작업 위치 추가 모달 (폴더 탐색 / GitHub 리포) — 메인 챗과 동일 -->
<div class="modal-overlay" id="ws-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ws-modal-title">
    <div class="modal-head">
      <div class="modal-tabs">
        <button type="button" class="modal-tab active" data-tab="folder">{{ '📁 폴더 선택' | t }}</button>
        <button type="button" class="modal-tab" data-tab="github">{{ '⑂ GitHub 리포' | t }}</button>
      </div>
      <button type="button" class="modal-close" id="ws-modal-close" aria-label="{{ '닫기' | t }}">✕</button>
    </div>
    <div class="modal-body" id="ws-modal-body"></div>
    <div class="modal-foot" id="ws-modal-foot"></div>
  </div>
</div>

<script>
const MODELS = {{ provider_models | tojson }};
const AGENT_ORDER = {{ agent_order | tojson }};
const COUNCIL_ENABLED = {{ council_enabled | tojson }};
</script>
<script src="/static/app.js?v={{ asset_v() }}"></script>
</body>
</html>
